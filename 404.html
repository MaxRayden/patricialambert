<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Patrícia Lambert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf6f3;
      --mocha: #4a3b35;
      --dusty: #dba39a;
      --espresso: #2d2420;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--cream);
      color: var(--espresso);
      text-align: center;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      margin: 0 0 0.75rem;
      color: var(--mocha);
    }
    p { margin: 0 0 1.5rem; line-height: 1.6; max-width: 28rem; }
    a {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      background: var(--mocha);
      color: var(--cream);
      text-decoration: none;
      border-radius: 999px;
      font-weight: 500;
    }
    a:hover { background: var(--espresso); }
  </style>
</head>
<body>
  <div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi movido.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
